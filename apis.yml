name: Plan A
description: 'Plan A is a Berlin-based sustainability technology company providing certified
  carbon accounting and ESG management software that helps businesses measure, report,
  and reduce their greenhouse gas emissions. The platform is built on GHG Protocol
  standards, is SOC 2 Type II certified, and offers AI-enhanced emissions intelligence,
  supplier engagement, decarbonisation planning, and regulatory reporting (CSRD/ESRS).
  Plan A operates enterprise data integrations via custom APIs but does not publish
  a public developer platform, OpenAPI specification, or API reference. Backed by HV
  Capital and Lightspeed Venture Partners; surfaced to the API Evangelist network as
  a VC-portfolio lead and enriched with verified public identity and web properties.'
